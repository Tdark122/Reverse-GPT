<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reverse GPT</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --user-bubble: #1f6feb;
    --ai-bubble: #21262d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #auth-screen { flex: 1; display: flex; align-items: center; justify-content: center; }
  .auth-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 320px;
  }
  .auth-box h1 { font-size: 22px; margin: 0 0 4px; }
  .auth-box p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .auth-box input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0d1117;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .auth-box button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  #auth-error { color: #f85149; font-size: 13px; margin-top: 10px; min-height: 16px; }
  #chat-screen { display: none; flex: 1; flex-direction: column; height: 100vh; }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
  }
  header h2 { margin: 0; font-size: 16px; }
  header button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: white; }
  .msg.ai { align-self: flex-start; background: var(--ai-bubble); color: var(--text); }
  #input-row { display: flex; padding: 12px; border-top: 1px solid var(--border); background: var(--panel); gap: 8px; }
  #input-row textarea {
    flex: 1;
    resize: none;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
  }
  #input-row button {
    background: var(--accent);
    border: none;
    color: #0d1117;
    font-weight: 600;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
  }
  #input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { color: var(--muted); font-size: 13px; padding-left: 4px; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h1>Reverse GPT</h1>
    <p class="sub">Sign in to start a coding session</p>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn">Log In</button>
    <button id="signup-btn" class="secondary">Create Account</button>
    <div id="auth-error"></div>
  </div>
</div>

<div id="chat-screen">
  <header>
    <h2>Reverse GPT — coding assistant</h2>
    <button id="logout-btn">Log out</button>
  </header>
  <div id="messages"></div>
  <div id="input-row">
    <textarea id="chat-input" placeholder="Ask a coding question..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Safe to expose publicly — identifies your project, not a secret.
  const firebaseConfig = {
    apiKey: "AIzaSyC4xb59rh3GVEh9BEzOfF6CG5uu3VHv_Wg",
    authDomain: "pay-bfba2.firebaseapp.com",
    projectId: "pay-bfba2",
    storageBucket: "pay-bfba2.firebasestorage.app",
    messagingSenderId: "145331241096",
    appId: "1:145331241096:web:39bd6339ae2a8fdd5e5f3d"
  };

  // This points at your Vercel API route (api/chat.js). Update after deploying to Vercel.
  const API_URL = "/api/chat"; // relative path works automatically once hosted on Vercel

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const authScreen = document.getElementById("auth-screen");
  const chatScreen = document.getElementById("chat-screen");
  const authError = document.getElementById("auth-error");
  const messagesEl = document.getElementById("messages");
  const chatInput = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");

  let currentUser = null;
  let unsubscribeMessages = null;

  document.getElementById("signup-btn").onclick = async () => {
    try {
      await createUserWithEmailAndPassword(auth, email.value, password.value);
    } catch (e) { authError.textContent = e.message; }
  };

  document.getElementById("login-btn").onclick = async () => {
    try {
      await signInWithEmailAndPassword(auth, email.value, password.value);
    } catch (e) { authError.textContent = e.message; }
  };

  document.getElementById("logout-btn").onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      authScreen.style.display = "none";
      chatScreen.style.display = "flex";
      loadMessages(user.uid);
    } else {
      authScreen.style.display = "flex";
      chatScreen.style.display = "none";
      if (unsubscribeMessages) unsubscribeMessages();
      messagesEl.innerHTML = "";
    }
  });

  function loadMessages(uid) {
    const q = query(collection(db, "users", uid, "messages"), orderBy("createdAt", "asc"));
    unsubscribeMessages = onSnapshot(q, (snap) => {
      messagesEl.innerHTML = "";
      snap.forEach((doc) => renderMessage(doc.data()));
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function renderMessage({ role, text }) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "ai");
    div.textContent = text;
    messagesEl.appendChild(div);
  }

  async function saveMessage(uid, role, text) {
    await addDoc(collection(db, "users", uid, "messages"), { role, text, createdAt: serverTimestamp() });
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || !currentUser) return;

    chatInput.value = "";
    sendBtn.disabled = true;
    await saveMessage(currentUser.uid, "user", text);

    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.textContent = "Reverse GPT is thinking...";
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const idToken = await currentUser.getIdToken();
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        renderMessage({ role: "ai", text: "Error: " + (data.error || "something went wrong") });
        return;
      }
      await saveMessage(currentUser.uid, "ai", data.reply);
    } catch (err) {
      typingEl.remove();
      renderMessage({ role: "ai", text: "Network error: " + err.message });
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.onclick = sendMessage;
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
</script>
</body>
</html>
